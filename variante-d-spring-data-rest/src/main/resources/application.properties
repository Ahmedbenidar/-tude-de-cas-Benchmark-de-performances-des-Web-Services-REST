server.port=9203
spring.application.name=variante-d-spring-data-rest

spring.datasource.url=jdbc:mysql://localhost:3306/benchmark_rest?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.data.rest.default-page-size=20
spring.data.rest.max-page-size=500
spring.data.rest.base-path=/
spring.data.rest.return-body-on-create=true
spring.data.rest.return-body-on-update=true

server.tomcat.threads.max=200
server.tomcat.threads.min-spare=32
server.tomcat.accept-count=200

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
